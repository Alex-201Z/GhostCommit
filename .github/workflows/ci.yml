name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghostcommit
          POSTGRES_PASSWORD: ghostcommit
          POSTGRES_DB: ghostcommit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghostcommit -d ghostcommit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ghostcommit:ghostcommit@localhost:5432/ghostcommit_test?schema=public
      RUN_DATABASE_TESTS: 'true'
      JWT_SECRET: ci-only-secret-with-sufficient-entropy
      GITHUB_CLIENT_ID: ci-client-id
      GITHUB_CLIENT_SECRET: ci-client-secret
      GITHUB_CALLBACK_URL: http://localhost:3000/api/v1/auth/github/callback
      DASHBOARD_AUTH_SUCCESS_URL: http://localhost:5173/auth/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Deploy database migrations
        run: npm exec --workspace @ghostcommit/backend -- prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: PostgreSQL integration tests
        run: npm run test:e2e --workspace @ghostcommit/backend
      - name: Build
        run: npm run build
